<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Finscure — Learn Stock Trading the Right Way</title>
    <meta name="description" content="India's step-by-step stock market learning platform. 30 modules, mock trading with real prices, and interactive charts. Free to start." />
    <meta name="keywords" content="stock market, learn trading, NSE, BSE, mock trading, stock screener, technical analysis, fundamental analysis, India, Finscure" />
    <meta name="author" content="Finscure LLP" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finscure" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Finscure — Learn Stock Trading the Right Way" />
    <meta property="og:description" content="30 modules. Mock trading with real NSE prices. Interactive charts with 11 indicators. Free to start." />
    <meta property="og:image" content="/logo-md.png" />
    <meta property="og:url" content="https://finscure-screener.vercel.app" />
    <meta property="og:site_name" content="Finscure" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Finscure — Learn Stock Trading the Right Way" />
    <meta name="twitter:description" content="India's step-by-step stock market learning platform. Free to start." />
    <meta name="twitter:image" content="/logo-md.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0e17" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-sm.png" />
    <link rel="apple-touch-icon" href="/logo-md.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
