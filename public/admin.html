<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finscure Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090f;--bg2:#0d1117;--card:#111827;--border:rgba(255,255,255,0.06);--text:#f1f5f9;--muted:#64748b;--green:#63dca0;--red:#f87171;--blue:#60a5fa;--amber:#fbbf24;--purple:#a78bfa;--green-dim:rgba(99,220,160,0.1);--red-dim:rgba(248,113,113,0.1);--blue-dim:rgba(96,165,250,0.1)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.admin-layout{display:flex;min-height:100vh}
.admin-sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);padding:20px 12px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
.admin-main{margin-left:220px;padding:24px;flex:1;min-height:100vh}
.admin-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 8px}
.admin-logo-icon{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#07090f}
.admin-logo-text{font-size:18px;font-weight:700}
.admin-logo-badge{font-size:10px;font-weight:700;background:var(--green-dim);color:var(--green);padding:2px 8px;border-radius:4px;margin-left:4px}
.nav-section{margin-bottom:20px}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:0 12px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);transition:all 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.nav-item.active{background:var(--green-dim);color:var(--green);font-weight:600}
.nav-badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--blue-dim);color:var(--blue);padding:1px 8px;border-radius:10px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--muted)}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:16px;font-weight:700}
.section-sub{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border)}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-blue{background:var(--blue-dim);color:var(--blue)}
.badge-amber{background:rgba(251,191,36,0.1);color:var(--amber)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-purple{background:rgba(167,139,250,0.1);color:var(--purple)}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:400px}
.btn-google{display:inline-flex;align-items:center;gap:10px;padding:12px 28px;border-radius:10px;background:var(--green);color:#07090f;font-weight:700;font-size:15px;border:none;cursor:pointer;font-family:inherit}
.btn-google:hover{opacity:0.9}
.error-msg{background:var(--red-dim);color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px}
.user-footer{position:absolute;bottom:16px;left:12px;right:12px;display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--green-dim);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top:2px solid var(--green);border-radius:50%;animation:spin 0.6s linear infinite;margin:20px auto}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ═══════════════════════════════════════════════
// PASTE YOUR FIREBASE CONFIG HERE
// Get it from: Firebase Console → Project Settings → Your apps → Config
// ═══════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "finscure-screener.firebaseapp.com",
  projectId: "finscure-screener",
  storageBucket: "finscure-screener.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};
// ═══════════════════════════════════════════════

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);
const fmt = n => { if (!n) return "₹0"; const a = Math.abs(n); if (a >= 1e7) return `₹${(n/1e7).toFixed(2)}Cr`; if (a >= 1e5) return `₹${(n/1e5).toFixed(2)}L`; return `₹${n.toLocaleString("en-IN",{maximumFractionDigits:0})}`; };

let currentPage = "dashboard";
let adminData = { users: [], portfolios: [], transactions: [], progress: [], isAdmin: false };

function renderApp(user) {
  if (!user) {
    $("app").innerHTML = `<div class="login-screen"><div class="login-card"><div style="font-size:48px;margin-bottom:16px">🔐</div><h2 style="margin-bottom:8px">Finscure Admin</h2><p style="color:var(--muted);margin-bottom:24px;font-size:14px">Sign in with your admin Google account</p><button class="btn-google" id="signInBtn">Sign In with Google</button><div id="loginError"></div></div></div>`;
    $("signInBtn").onclick = async () => {
      try { await signInWithPopup(auth, provider); }
      catch (e) { $("loginError").innerHTML = `<div class="error-msg">${e.message}</div>`; }
    };
    return;
  }
  renderAdmin(user);
}

async function checkAdmin(uid) {
  try {
    const snap = await getDoc(doc(db, "platform_config", "admin"));
    if (snap.exists() && snap.data().uids && snap.data().uids.includes(uid)) return true;
  } catch (e) {}
  return false;
}

async function setupAdmin(uid) {
  // First-time setup: if no admin config exists, create it with current user as admin
  try {
    const snap = await getDoc(doc(db, "platform_config", "admin"));
    if (!snap.exists()) {
      // No admin configured yet — make current user admin
      await setDoc(doc(db, "platform_config", "admin"), { uids: [uid], createdAt: new Date().toISOString() });
      return true;
    }
  } catch (e) {
    // If rules block this, we need to temporarily allow it
    console.error("Could not setup admin:", e);
  }
  return false;
}

async function loadAllData() {
  try {
    const [usersSnap, portfoliosSnap, txSnap, progressSnap] = await Promise.all([
      getDocs(collection(db, "users")),
      getDocs(collection(db, "mock_portfolios")),
      getDocs(query(collection(db, "mock_transactions"), orderBy("timestamp", "desc"), limit(200))),
      getDocs(collection(db, "progress")),
    ]);
    adminData.users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    adminData.portfolios = portfoliosSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    adminData.transactions = txSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    adminData.progress = progressSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    return true;
  } catch (e) {
    console.error("Failed to load data:", e);
    return false;
  }
}

async function renderAdmin(user) {
  $("app").innerHTML = `<div class="login-screen"><div><div class="spinner"></div><div style="color:var(--muted);font-size:14px">Checking admin access...</div></div></div>`;
  
  let isAdmin = await checkAdmin(user.uid);
  if (!isAdmin) {
    // Try first-time setup
    const setup = await setupAdmin(user.uid);
    if (setup) isAdmin = true;
    else isAdmin = await checkAdmin(user.uid);
  }

  if (!isAdmin) {
    $("app").innerHTML = `<div class="login-screen"><div class="login-card"><div style="font-size:48px;margin-bottom:16px">⛔</div><h2 style="margin-bottom:8px">Access Denied</h2><p style="color:var(--muted);font-size:14px;margin-bottom:8px">Your account (${user.email}) is not an admin.</p><p style="color:var(--muted);font-size:12px;margin-bottom:20px">UID: <code class="mono" style="font-size:11px;background:var(--bg2);padding:2px 6px;border-radius:4px">${user.uid}</code></p><p style="color:var(--muted);font-size:12px;margin-bottom:20px">To grant admin access, add this UID to the <code style="background:var(--bg2);padding:2px 6px;border-radius:4px">platform_config/admin</code> document in Firestore.</p><button class="btn-google" style="background:var(--red)" id="signOutBtn">Sign Out</button></div></div>`;
    $("signOutBtn").onclick = () => signOut(auth);
    return;
  }

  $("app").innerHTML = `<div class="login-screen"><div><div class="spinner"></div><div style="color:var(--muted);font-size:14px">Loading platform data...</div></div></div>`;
  
  const loaded = await loadAllData();
  if (!loaded) {
    $("app").innerHTML = `<div class="login-screen"><div class="login-card"><div style="font-size:48px;margin-bottom:16px">⚠️</div><h2 style="margin-bottom:8px">Error Loading Data</h2><p style="color:var(--muted);font-size:14px;margin-bottom:20px">Could not read Firestore data. Make sure you've published the updated Firestore rules.</p><button class="btn-google" onclick="location.reload()">Retry</button></div></div>`;
    return;
  }

  renderDashboard(user);
}

function renderDashboard(user) {
  const { users, portfolios, transactions, progress } = adminData;
  const totalTrades = transactions.length;
  const totalLessons = progress.length;
  const onboarded = users.filter(u => u.interface_stage !== undefined).length;
  const stageCount = { 1: 0, 2: 0, 3: 0, 4: 0 };
  users.forEach(u => { if (u.interface_stage) stageCount[u.interface_stage] = (stageCount[u.interface_stage] || 0) + 1; });
  const recentUsers = [...users].sort((a, b) => { const ta = a.createdAt?.toDate?.() || new Date(a.createdAt || 0); const tb = b.createdAt?.toDate?.() || new Date(b.createdAt || 0); return tb - ta; }).slice(0, 8);
  const topTraders = portfolios.sort((a, b) => {
    const aVal = (a.cash || 0) + (a.holdings || []).reduce((s, h) => s + h.qty * h.avgPrice, 0);
    const bVal = (b.cash || 0) + (b.holdings || []).reduce((s, h) => s + h.qty * h.avgPrice, 0);
    return bVal - aVal;
  }).slice(0, 5);

  const navItems = [
    { id: "dashboard", icon: "📊", label: "Dashboard", section: "OVERVIEW" },
    { id: "users", icon: "👥", label: "Users", section: "MANAGE", badge: users.length },
    { id: "trades", icon: "💹", label: "Trades", section: "MANAGE", badge: totalTrades },
  ];

  $("app").innerHTML = `
  <div class="admin-layout">
    <div class="admin-sidebar">
      <div class="admin-logo"><div class="admin-logo-icon">F</div><div class="admin-logo-text">Finscure</div><span class="admin-logo-badge">ADMIN</span></div>
      ${["OVERVIEW", "MANAGE"].map(sec => `
        <div class="nav-section"><div class="nav-label">${sec}</div>
        ${navItems.filter(n => n.section === sec).map(n => `<div class="nav-item ${currentPage === n.id ? "active" : ""}" data-page="${n.id}"><span>${n.icon}</span> ${n.label} ${n.badge ? `<span class="nav-badge">${n.badge}</span>` : ""}</div>`).join("")}
        </div>
      `).join("")}
      <div class="user-footer"><div class="user-avatar">${(user.displayName || "A")[0]}</div><div><div style="font-size:13px;font-weight:600">${user.displayName || "Admin"}</div><div style="font-size:11px;color:var(--muted)">Super Admin</div></div></div>
    </div>
    <div class="admin-main">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
        <div><h1 style="font-size:22px;font-weight:700">${currentPage === "dashboard" ? "Dashboard" : currentPage === "users" ? "Users" : "Trades"}</h1><p style="font-size:13px;color:var(--muted)">Platform overview · ${users.length} users</p></div>
        <button onclick="document.querySelector('[data-action=signout]').click()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit" data-action="signout">Sign Out</button>
      </div>
      <div id="pageContent"></div>
    </div>
  </div>`;

  // Nav clicks
  document.querySelectorAll(".nav-item").forEach(el => {
    el.onclick = () => { currentPage = el.dataset.page; renderDashboard(user); };
  });
  document.querySelector("[data-action=signout]").onclick = () => signOut(auth);

  // Render page content
  if (currentPage === "dashboard") {
    $("pageContent").innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--green-dim)">👥</div><div class="stat-val" style="color:var(--green)">${users.length}</div><div class="stat-label">Total Users</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--blue-dim)">✅</div><div class="stat-val" style="color:var(--blue)">${onboarded}</div><div class="stat-label">Onboarded Users</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(251,191,36,0.1)">💹</div><div class="stat-val" style="color:var(--amber)">${totalTrades}</div><div class="stat-label">Total Mock Trades</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(167,139,250,0.1)">📚</div><div class="stat-val" style="color:var(--purple)">${totalLessons}</div><div class="stat-label">Lesson Progress Records</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="section-card"><div class="section-header"><div><div class="section-title">User Stage Distribution</div><div class="section-sub">Based on interface_stage</div></div></div><div style="padding:20px;display:flex;gap:12px">
        ${Object.entries(stageCount).map(([s, c]) => `<div style="flex:1;text-align:center;padding:14px;background:var(--bg2);border-radius:8px"><div class="mono" style="font-size:24px;font-weight:700">${c}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">Stage ${s}</div></div>`).join("")}
      </div></div>
      <div class="section-card"><div class="section-header"><div><div class="section-title">Recent Signups</div><div class="section-sub">Latest registered users</div></div></div><div style="max-height:200px;overflow-y:auto">
        ${recentUsers.map(u => `<div style="display:flex;justify-content:space-between;padding:8px 20px;border-bottom:1px solid var(--border);font-size:12px"><span style="font-weight:600">${u.displayName || u.email || u.id.slice(0,8)}</span><span style="color:var(--muted)">${u.interface_stage ? `Stage ${u.interface_stage}` : "Not onboarded"}</span></div>`).join("")}
      </div></div>
    </div>
    <div class="section-card"><div class="section-header"><div><div class="section-title">Top Portfolios</div><div class="section-sub">By portfolio value</div></div></div><table><thead><tr><th>User ID</th><th>Cash</th><th>Holdings</th><th>Stocks</th></tr></thead><tbody>
      ${topTraders.map(p => `<tr><td class="mono" style="font-size:11px">${p.id.slice(0,12)}...</td><td class="mono">${fmt(p.cash)}</td><td>${(p.holdings || []).length} stocks</td><td style="font-size:11px;color:var(--muted)">${(p.holdings || []).map(h => h.symbol).join(", ") || "—"}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if (currentPage === "users") {
    $("pageContent").innerHTML = `
    <div class="section-card"><div class="section-header"><div><div class="section-title">All Users (${users.length})</div></div></div><table><thead><tr><th>Name</th><th>Email</th><th>Stage</th><th>Level</th><th>Joined</th></tr></thead><tbody>
      ${users.map(u => { const d = u.createdAt?.toDate?.() || (u.createdAt ? new Date(u.createdAt) : null); return `<tr><td style="font-weight:600">${u.displayName || "—"}</td><td style="font-size:12px;color:var(--muted)">${u.email || "—"}</td><td><span class="badge badge-${u.interface_stage === 1 ? "green" : u.interface_stage === 2 ? "blue" : u.interface_stage === 3 ? "amber" : "purple"}">Stage ${u.interface_stage || "?"}</span></td><td style="font-size:12px">${u.placement_level || "—"}</td><td style="font-size:12px;color:var(--muted)">${d ? d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "—"}</td></tr>`; }).join("")}
    </tbody></table></div>`;
  } else if (currentPage === "trades") {
    $("pageContent").innerHTML = `
    <div class="section-card"><div class="section-header"><div><div class="section-title">Recent Transactions (${transactions.length})</div></div></div><table><thead><tr><th>Type</th><th>Stock</th><th>Qty</th><th>Price</th><th>Total</th><th>P&L</th><th>User</th><th>Date</th></tr></thead><tbody>
      ${transactions.slice(0, 50).map(tx => `<tr><td><span class="badge ${tx.type === "BUY" ? "badge-green" : "badge-red"}">${tx.type}</span></td><td style="font-weight:600">${tx.symbol}</td><td class="mono">${tx.quantity}</td><td class="mono">₹${tx.price?.toFixed(2)}</td><td class="mono">${fmt(tx.total)}</td><td>${tx.pnl !== undefined ? `<span class="mono" style="font-weight:600;color:${tx.pnl >= 0 ? "var(--green)" : "var(--red)"}">${tx.pnl >= 0 ? "+" : ""}${fmt(tx.pnl)}</span>` : "—"}</td><td class="mono" style="font-size:11px;color:var(--muted)">${(tx.userId || "").slice(0, 8)}...</td><td style="font-size:12px;color:var(--muted)">${tx.timestamp ? new Date(tx.timestamp).toLocaleDateString("en-IN",{day:"numeric",month:"short"}) : "—"}</td></tr>`).join("")}
    </tbody></table></div>`;
  }
}

onAuthStateChanged(auth, user => renderApp(user));
</script>
</body>
</html>
